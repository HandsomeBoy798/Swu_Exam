name: Import general courses once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/swu-general-once.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'HandsomeBoy798/Swu_Exam' && contains(github.event.head_commit.message, '[import-general-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SEED_SHA: ${{ github.sha }}
    steps:
      - name: Preserve layout and import verified general-course files
        shell: bash
        run: |
          python3 -u <<'PYWORKER'
          import base64, hashlib, json, os, time, urllib.parse, urllib.request, zlib
          PLAN=json.loads(zlib.decompress(base64.b64decode('')))
          REPO=PLAN['repo']
          TOKEN=os.environ['GH_TOKEN']
          SEED=os.environ['SEED_SHA']
          TEMP='.github/workflows/swu-general-once.yml'
          assert os.environ['GITHUB_REPOSITORY']==REPO
          def api(method,path,value=None):
              body=None if value is None else json.dumps(value,ensure_ascii=False).encode()
              req=urllib.request.Request('https://api.github.com/repos/'+REPO+'/'+path,data=body,method=method,headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'Swu-Exam-General-Course-Importer','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=90) as response:
                  return json.load(response)
          def head():
              return api('GET','git/ref/heads/main')['object']['sha']
          def files(tree):
              assert not tree.get('truncated')
              return {x['path']:x['sha'] for x in tree['tree'] if x['type']=='blob'}
          assert head()==SEED,'main changed before import; preserve concurrent edits'
          commit=api('GET','git/commits/'+SEED)
          original=files(api('GET','git/trees/'+commit['tree']['sha']+'?recursive=1'))
          expected=dict(original)
          entries=[]
          for row in PLAN['copies']:
              assert row['target'] not in original,'Refuse to overwrite an existing user file'
              url='https://raw.githubusercontent.com/'+PLAN['source_repo']+'/'+PLAN['source_commit']+'/'+urllib.parse.quote(row['source'],safe='/')
              for attempt in range(4):
                  try:
                      data=urllib.request.urlopen(url,timeout=90).read()
                      break
                  except Exception:
                      if attempt==3:raise
                      time.sleep(2**attempt)
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert len(data)==row['size'] and sha==row['sha'],'Source file integrity check failed'
              uploaded=api('POST','git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert uploaded['sha']==sha
              entries.append({'path':row['target'],'type':'blob','mode':'100644','sha':sha})
              expected[row['target']]=sha
              print('Verified and uploaded: '+row['target'],flush=True)
          empty=api('POST','git/blobs',{'content':'','encoding':'utf-8'})['sha']
          for path in PLAN['placeholders']:
              assert path not in original
              entries.append({'path':path,'type':'blob','mode':'100644','sha':empty})
              expected[path]=empty
          tree=api('POST','git/trees',{'base_tree':commit['tree']['sha'],'tree':entries})
          actual=files(api('GET','git/trees/'+tree['sha']+'?recursive=1'))
          assert actual==expected,'Unexpected file additions, removals or changes'
          groups={}
          prefix=PLAN['root']+'/'
          for path in actual:
              if path.startswith(prefix):
                  parts=path[len(prefix):].split('/')
                  assert len(parts)>=3
                  groups.setdefault(parts[0],set()).add(parts[1])
          assert set(groups)==set(PLAN['courses']) and all(x=={'复习资料','exam'} for x in groups.values())
          assert head()==SEED,'main changed during import; final update aborted'
          new=api('POST','git/commits',{'tree':tree['sha'],'parents':[SEED],'message':'Restore five general-course folders and import four course collections\n\nPreserve all existing files and paths. Add 11 verified source files and four empty-folder placeholders.'})
          api('PATCH','git/refs/heads/main',{'sha':new['sha'],'force':False})
          print('GENERAL_IMPORT_RESULT='+json.dumps({'commit':new['sha'],'tree':tree['sha'],'copied':len(PLAN['copies']),'courses':PLAN['courses'],'placeholders':len(PLAN['placeholders'])},ensure_ascii=False),flush=True)
          PYWORKER
