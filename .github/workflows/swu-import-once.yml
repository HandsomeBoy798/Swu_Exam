name: Import SWU courses once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/swu-import-once.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'HandsomeBoy798/Swu_Exam' && contains(github.event.head_commit.message, '[import-swu-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SEED_SHA: ${{ github.sha }}
    steps:
      - name: Import pinned course files and verify checksums
        shell: bash
        run: |
          python3 -u <<'PYWORKER'
          import hashlib, os, urllib.request
          url = 'https://raw.githubusercontent.com/HandsomeBoy798/Swu_Exam/' + os.environ['SEED_SHA'] + '/.github/swu-import.py'
          code = urllib.request.urlopen(url, timeout=90).read()
          assert hashlib.sha256(code).hexdigest() == '36f46d69d6f0b352b0c9cea85717a102656a13cb6f821cfee1f060cecc03fe3f'
          exec(compile(code, 'swu-import.py', 'exec'), {'__name__': '__main__'})
          PYWORKER
